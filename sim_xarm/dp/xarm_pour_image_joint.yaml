# diffusion_policy task config for the sim_xarm pouring data (7-D absolute joint targets, no gripper).
# Installed by sim_xarm/dp/install_dp.sh (copies this file into diffusion_policy's config/task/);
# sim_xarm/dp/train.sh sets PYTHONPATH for the dataset and runner classes.
# Policy structure is the one used for LIBERO (CNN, eps-prediction, horizon 16, n_obs 2, n_action 8);
# those live in the workspace config, not here.
name: xarm_pour_image_joint

shape_meta: &shape_meta
  obs:
    agentview_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eef_pos:          # cup-mouth centre (observation.eef_frame), world frame, m
      shape: [3]
    robot0_eef_quat:         # xyzw
      shape: [4]
    # Joint angles are recorded but not a policy input (same as the LIBERO setting). To use them:
    # robot0_joint_pos:
    #   shape: [7]
  action:
    shape: [7]               # absolute commanded joint targets J1..J7 (rad); no gripper channel

task_name: &task_name xarm_pour
dataset_path: /workspace/data/sim_xarm/xarm_pour/image_joint.hdf5   # override: task.dataset_path=<exported hdf5>
abs_action: &abs_action True

env_runner:
  # No-fault rollouts during training on fixed seeds (one per grid cell), logged as
  # test_mean_score = success rate, so the upstream checkpoint.topk (test_mean_score, max, k=5)
  # keeps the 5 best checkpoints by task success -- as the LIBERO runs did (n_test 50 there).
  # Set training.rollout_every == training.checkpoint_every. Inference as in the evaluation and
  # the real-robot plan: DDIM 10 steps. Use xarm_pour_runner.NullRunner to train without rollouts
  # (then checkpoint on train_loss).
  _target_: xarm_pour_runner.PourEnvRunner
  output_dir: ${hydra:runtime.output_dir}
  shape_meta: *shape_meta
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  n_test: 25
  test_start_seed: 100000
  n_workers: 8
  sampler: ddim
  inference_steps: 10
  max_steps: 300
  config_overrides: []

dataset:
  _target_: xarm_pour_dataset.XArmPourImageDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  use_cache: True
  seed: 42
  val_ratio: 0.02
