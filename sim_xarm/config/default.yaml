# FAVOR xArm7 pouring simulation -- single source of truth for scene, cameras, control,
# particles, task and randomization. Units: metres, radians, seconds, kilograms unless a key
# ends in _deg / _mm / _g / _hz / _ms.
#
# Frames: world origin = centre of the robot base mounting plate, on the table top (z = 0 is the
# table surface). +x points forward from the robot, +z up.
# Every value marked "TODO(real): measure" is a placeholder until the real setup is measured.
# Override any key from the command line of the scripts with  --set a.b.c=value  or a second yaml
# (--config default.yaml --config real_calib.yaml); later files win.

assets:
  # Cloned by sim_xarm/setup_assets.sh at the commits pinned in sim_xarm/README.md.
  menagerie_dir: third_party/mujoco_menagerie        # relative to sim_xarm/
  urdf: assets/xarm7_favor.urdf                      # generated by scripts/make_urdf.py (kinematics only)

robot:
  base_pos: [0.0, 0.0, 0.0]          # TODO(real): measure (mount position on the table)
  base_yaw_deg: 0.0                  # TODO(real): measure
  # Official xArm7 limits (UFACTORY technical specifications), applied to the MJCF joints and to
  # the IK. The Menagerie MJCF differs on J2 (+120 deg) and J4 (-11 deg) -- see README.
  joint_limits_deg:
    - [-360.0, 360.0]
    - [-117.0, 116.0]
    - [-360.0, 360.0]
    - [-6.0, 225.0]
    - [-360.0, 360.0]
    - [-97.0, 180.0]
    - [-360.0, 360.0]
  max_joint_speed_deg: 180.0         # official maximum; reduce for safety studies
  # Fixed start pose (cup upright, gripper pointing forward). Solved once by
  # scripts/solve_home.py for task.home_cup_pos and frozen here (rad).
  home_q: [0.2517, -0.1347, -0.1080, 1.1221, -0.0152, 1.2560, -0.8979]
  gripper:
    type: xarm_gripper               # xarm_gripper | robotiq_2f85   TODO(real): confirm gripper
    closed_ctrl: 200.0               # xarm_gripper actuator command that holds the cup handle (0..255)

cup:
  # The cup is rigidly attached to the gripper base link (no grasp physics); fingers stay closed.
  # hang: gripper points down and pinches a vertical handle plate on the cup side (cup axis parallel
  #       to the approach axis). side: gripper points forward, cup axis perpendicular to it.
  mount: hang                        # TODO(real): confirm how the cup is held
  mouth_above_grip: 0.015            # hang: cup mouth this far above the grip point (towards the flange)
  inner_radius: 0.031                # TODO(real): measure  (inner diameter 62 mm)
  inner_depth: 0.050                 # TODO(real): measure  (~151 ml)
  wall: 0.003
  bottom: 0.004
  n_wall_segments: 24
  mass: 0.060                        # empty cup + handle, kg  TODO(real): measure
  # Handle plate: length = radial reach from the cup wall, width = thickness between the fingers.
  handle: {length: 0.050, width: 0.020, height: 0.030}   # TODO(real): measure
  # Handle grip point along the gripper approach axis (gripper base frame, m from the flange).
  grip_z: 0.150
  rgba: [0.85, 0.85, 0.80, 1.0]

bowl:
  inner_radius: 0.060                # TODO(real): measure (inner diameter 120 mm)
  depth: 0.050                       # TODO(real): measure
  wall: 0.003
  bottom: 0.004
  n_wall_segments: 32
  scale_height: 0.030                # scale platform under the bowl  TODO(real): measure
  scale_size: [0.10, 0.10]           # half extents of the scale top  TODO(real): measure
  rgba: [0.20, 0.45, 0.80, 1.0]

table:
  size: [1.20, 0.80]                 # TODO(real): measure (x, y full size)
  height: 0.75                       # TODO(real): measure (floor to top)
  thickness: 0.04
  # Offset of the table centre from the robot base (robot sits near the back edge).
  center_offset: [0.45, 0.0]         # TODO(real): measure
  rgba: [0.55, 0.45, 0.35, 1.0]

particles:
  diameter_mm: 6.0                   # TODO(real): match the beads
  count: 420                         # 50 g of 6 mm ABS beads ~ 420
  total_mass_g: 50.0                 # each particle = total_mass / count (keeps 50.0 g exactly)
  friction: [0.5, 0.005, 0.0001]     # sliding, torsional, rolling
  solref: [0.004, 1.0]
  solimp: [0.9, 0.95, 0.001]
  condim: 3
  spawn_jitter: 0.0005               # random xy jitter of the initial lattice (m)
  settle_time: 1.0                   # s of physics with the robot at home before t = 0
  rgba: [0.90, 0.75, 0.20, 1.0]

physics:
  timestep: 0.002                    # s
  integrator: implicitfast
  # CG: with ~2500 particle DoFs and ~1000 contacts Newton costs ~700 ms/step here (CG 30 it: 9 ms).
  solver: CG
  iterations: 20
  ls_iterations: 10
  tolerance: 1.0e-8
  noslip_iterations: 0
  cone: pyramidal
  impratio: 1.0
  # Invisible collision shells of cup and bowl are this much thicker than the visual walls (m):
  # 3-4 mm walls let beads tunnel through under the CG contact solution (M4 analysis).
  collision_shell_extra: 0.008
  gravity_comp: true                 # arm and gripper gravity-compensated (stiff industrial servo)

control:
  policy_hz: 10                      # one action = one absolute 7-joint target
  # servo:  Mode 1 -- 10 Hz target linearly interpolated and streamed at stream_hz, each tick's
  #         increment clamped to max_joint_speed * dt (the controller's speed limit).
  # online: Mode 6 -- at every policy step the joint motion is re-planned from the current
  #         commanded state with a trapezoidal profile (planner_speed_deg, planner_acc_deg).
  mode: servo                        # servo | online   TODO(real): decide (RT kernel?)
  stream_hz: 100
  planner_speed_deg: 180.0
  planner_acc_deg: 1145.0            # 20 rad/s^2
  latency_ms: 0.0                    # command transport delay  TODO(real): fit to step response
  velocity_feedforward: true         # servo tracks the command stream (see control.py)  TODO(real): fit
  # Joint position servo (MuJoCo 'general' actuator, affine bias): tau = kp (q_cmd - q) - kv qdot.
  # Defaults are the Menagerie values; fit to real step responses later.
  kp: [1500, 1500, 1000, 1000, 1000, 800, 800]
  kv: [150, 150, 100, 100, 100, 80, 80]
  force_limit: [50, 50, 30, 30, 30, 20, 20]  # Nm (Menagerie)  TODO(real): check against spec
  joint_damping: [10, 10, 5, 5, 5, 2, 2]
  armature: 0.1
  frictionloss: 1.0

cameras:
  # Extrinsics are given either as  {type: lookat, pos, target, up}  (world frame) or as
  # {type: matrix, T: 4x4 row-major, convention: opencv|mujoco, parent: world|wrist_mount}.
  # opencv = camera x right, y down, z forward (what a calibration toolbox returns);
  # mujoco = x right, y up, looking along -z.  Intrinsics: fovy_deg, or fx/fy/cx/cy in pixels.
  agentview:                         # fixed side camera (RealSense D435 class)
    parent: world
    extrinsics: {type: lookat, pos: [0.60, -0.85, 0.60], target: [0.40, -0.08, 0.14], up: [0, 0, 1]}  # TODO(real): calibrate
    intrinsics: {width: 640, height: 480, fovy_deg: 42.0}   # TODO(real): calibrate
  eye_in_hand:                       # wrist camera (RealSense D405 class), on the gripper base
    parent: gripper
    # In the gripper base frame (z = approach axis, cup on +x). Mounted on the gripper body on the
    # side opposite the cup, looking past the fingers at the cup mouth and the bowl below.
    extrinsics: {type: lookat, pos: [-0.085, 0.0, 0.070], target: [0.070, 0.0, 0.25], up: [0, 0, -1]}  # TODO(real): calibrate
    intrinsics: {width: 640, height: 480, fovy_deg: 58.0}   # TODO(real): calibrate
  policy_size: 84                    # images handed to the policy are resized to this (square)
  render_size: [240, 320]            # (H, W) rendered before resizing (same aspect as the intrinsics;
                                     # fovy is angular, so any size keeps the projection). 480x640 for full res.
  resize: center_crop_then_area      # 4:3 frame -> centre square crop -> 84x84 (INTER_AREA)
  # Render quality. MSAA is the dominant cost of CPU (OSMesa) rendering (0.5 -> 0.2 s per frame) and
  # is irrelevant after the INTER_AREA downsampling to 84 x 84; kept off everywhere so images do not
  # depend on the machine.
  quality: {offsamples: 0, shadow_size: 2048}

task:
  # Bowl placement: 5 x 5 grid on a 20 x 20 cm square (grid mode) or uniform in the square.
  grid_center: [0.45, -0.10]         # TODO(real): measure (robot frame, m)
  grid_size: 0.20
  grid_n: 5
  placement: grid                    # grid | uniform
  home_cup_pos: [0.40, 0.0, 0.30]    # cup-mouth centre at home (world), cup upright
  home_cup_yaw_deg: -120.0           # pouring lip direction at home (about world z, 0 = +x)
  max_time: 30.0
  max_steps: 300
  success_fraction: 0.8              # f >= 0.8 and no safety violation
  settle_after: 1.0                  # s of extra physics (robot holding) before weighing
  particle_speed_settled: 0.02       # m/s; a particle counts as settled below this
  safety:
    table_clearance: 0.0             # any robot/gripper/cup contact with the table is a violation
    joint_limit_margin_deg: 0.0

kinematics:
  # Reference frame used by the IK methods and the scripted planner. 'cup_mouth' = centre of the
  # cup opening, z along the cup axis. 'gripper_tcp' = Menagerie link_tcp (172 mm from flange).
  tcp_frame: cup_mouth
  # Extra offset of the reference frame in that frame (m), e.g. to move it to the pouring lip.
  tcp_offset: [0.0, 0.0, 0.0]

observation:
  eef_frame: cup_mouth               # frame of robot0_eef_pos / robot0_eef_quat
  include_joint_pos: false           # LIBERO setting kept: joints are recorded but not a policy input
  quat_convention: xyzw              # robomimic / robosuite convention

randomization:
  enabled: false                     # one flag; every block below is only used when true
  lighting: {intensity: [0.6, 1.2], dir_jitter_deg: 25.0, ambient: [0.1, 0.4]}
  table_rgb_jitter: 0.15
  bowl_rgb_jitter: 0.20
  cup_rgb_jitter: 0.10
  particle_rgb_jitter: 0.10
  table_texture: true                # random procedural checker/noise texture
  camera_pos_jitter: 0.02            # m (each axis)
  camera_rot_jitter_deg: 2.0
  wrist_camera_pos_jitter: 0.005     # the wrist camera is rigidly mounted: smaller jitter
  wrist_camera_rot_jitter_deg: 1.0
  camera_fovy_jitter_deg: 1.5
  particle_friction: [0.3, 0.8]
  particle_diameter_mm: [5.5, 6.5]
  kp_scale: [0.8, 1.2]
  latency_ms: [0.0, 30.0]
